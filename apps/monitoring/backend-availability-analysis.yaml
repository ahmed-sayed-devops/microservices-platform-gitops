apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-availability
  namespace: microservices
spec:
  metrics:
    - name: backend-http-success-rate
      initialDelay: 15s
      count: 1
      failureLimit: 0
      successCondition: result[0] >= 0.95
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            (
              sum(
                rate(
                  http_requests_total{
                    service="backend-canary",
                    route="/",
                    status=~"2.."
                  }[2m]
                )
              )
              /
              sum(
                rate(
                  http_requests_total{
                    service="backend-canary",
                    route="/"
                  }[2m]
                )
              )
            )
            or vector(0)
