apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: monitoring
spec:
  parentRefs:
    - name: eg-gateway
      namespace: gateway-demo
      sectionName: https
  hostnames:
    - prometheus.microservices.home.arpa
  rules:
    - backendRefs:
        - name: monitoring-kube-prometheus-prometheus
          port: 9090

