apiVersion: batch/v1
kind: Job

metadata:
  name: mysql-replication-init
  namespace: microservices

  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: replication-init
    app.kubernetes.io/part-of: microservices-platform

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: replication-init

    spec:
      restartPolicy: OnFailure

      containers:
        - name: replication-init

          image: mysql:8.4

          command:
            - bash
            - /scripts/setup-replication.sh

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: REPLICATION_USER

            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: REPLICATION_PASSWORD

            - name: PRIMARY_HOST
              value: mysql-primary.microservices.svc.cluster.local

            - name: REPLICA_HOST
              value: mysql-replica.microservices.svc.cluster.local

            - name: REPLICATION_TIMEOUT
              value: "120"

          volumeMounts:
            - name: replication-script
              mountPath: /scripts
              readOnly: true

      volumes:
        - name: replication-script
          configMap:
            name: mysql-replication-init
            defaultMode: 0755
