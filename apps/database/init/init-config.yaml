apiVersion: v1
kind: ConfigMap

metadata:
  name: mysql-init
  namespace: microservices

  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: microservices-platform

data:

  01-init.sql: |
    USE inventory;

    CREATE TABLE IF NOT EXISTS products (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        description TEXT,
        price DECIMAL(10,2) NOT NULL,
        quantity INT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO products (name, description, price, quantity)
    VALUES
    ('Keyboard', 'Mechanical Keyboard', 500.00, 15),
    ('Mouse', 'Gaming Mouse', 250.00, 30),
    ('Monitor', '24 inch Monitor', 3500.00, 8);

  02-replication-user.sql: |
    CREATE USER IF NOT EXISTS 'replicator'@'%' IDENTIFIED BY 'replica123';

    GRANT REPLICATION SLAVE, REPLICATION CLIENT
    ON *.*
    TO 'replicator'@'%';

    FLUSH PRIVILEGES;
