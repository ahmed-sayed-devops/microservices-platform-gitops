apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql-primary
  namespace: microservices

  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: primary
    app.kubernetes.io/part-of: microservices-platform

spec:
  serviceName: mysql-primary
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/component: primary

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: primary
        app.kubernetes.io/part-of: microservices-platform

    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

            - name: mysql-config
              mountPath: /etc/mysql/conf.d/my.cnf
              subPath: my.cnf
              readOnly: true

            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          resources:
            requests:
              cpu: 200m
              memory: 256Mi

            limits:
              cpu: 600m
              memory: 512Mi

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  mysqladmin ping
                  -h 127.0.0.1
                  -uroot
                  -p"$MYSQL_ROOT_PASSWORD"
                  --silent

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  mysqladmin ping
                  -h 127.0.0.1
                  -uroot
                  -p"$MYSQL_ROOT_PASSWORD"
                  --silent

            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-primary-data

        - name: mysql-config
          configMap:
            name: mysql-primary-config

        - name: mysql-init
          configMap:
            name: mysql-init
