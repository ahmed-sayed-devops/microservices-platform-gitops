apiVersion: v1
kind: ConfigMap

metadata:
  name: mysql-primary-config
  namespace: microservices

data:
  my.cnf: |
    [mysqld]

    server-id = 1

    log_bin = mysql-bin

    binlog_format = ROW

    gtid_mode = ON

    enforce_gtid_consistency = ON

    log_replica_updates = ON

    skip_name_resolve = ON

    bind-address = 0.0.0.0
