apiVersion: v1
kind: Service

metadata:
  name: backend-stable
  namespace: microservices
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: microservices-platform

spec:
  type: ClusterIP

  ports:
    - name: http
      port: 4000
      protocol: TCP
      targetPort: http

  selector:
    app.kubernetes.io/name: backend
