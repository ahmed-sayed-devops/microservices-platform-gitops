apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: microservices
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: microservices-platform
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: backend

  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
