apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: application-route
  namespace: microservices

spec:
  parentRefs:
    - name: eg-gateway
      namespace: gateway-demo
      sectionName: https

  hostnames:
    - app.microservices.home.arpa

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend-stable
          port: 4000
          weight: 100
        - name: backend-canary
          port: 4000
          weight: 0

    - matches:
        - path:
            type: PathPrefix
            value: /internal
      backendRefs:
        - name: backend-stable
          port: 4000
          weight: 100
        - name: backend-canary
          port: 4000
          weight: 0

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
