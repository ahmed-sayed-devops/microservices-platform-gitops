name: GitOps CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Git diff
        run: git diff --check

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: python -m pip install yamllint

      - name: Validate YAML
        run: |
          yamllint -c .yamllint.yml apps infrastructure argocd

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate Kubernetes manifests
        run: |
          find apps infrastructure argocd \
            -type f \( -name "*.yaml" -o -name "*.yml" \) \
            -print0 |
          xargs -0 kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas
